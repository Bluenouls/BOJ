<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지식 강탈기 v2.0</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap');

  :root {
    --bg: #0a0a1a;
    --panel: #111128;
    --accent: #ff4f00;
    --blue: #00cfff;
    --yellow: #ffe600;
    --green: #00ff88;
    --text: #e8e8ff;
    --border: #2a2a50;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(0,207,255,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(255,79,0,0.05) 0%, transparent 60%);
  }

  h1 {
    font-family: 'Black Han Sans', sans-serif;
    text-align: center;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    letter-spacing: 2px;
    color: var(--yellow);
    text-shadow: 0 0 20px rgba(255,230,0,0.5);
    padding: 24px 16px 4px;
  }

  .subtitle {
    text-align: center;
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 16px;
    font-family: 'Jua', sans-serif;
  }

  .name-section {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 16px 16px;
    flex-wrap: wrap;
  }

  .name-label {
    font-family: 'Jua', sans-serif;
    font-size: 0.85rem;
    color: #aaa;
    white-space: nowrap;
  }

  #prof-name-input {
    font-family: 'Jua', sans-serif;
    font-size: 0.9rem;
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--accent);
    padding: 6px 12px;
    width: 140px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    text-align: center;
  }

  #prof-name-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 8px rgba(255,79,0,0.3);
  }

  #name-confirm-btn {
    font-family: 'Jua', sans-serif;
    font-size: 0.8rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 7px 14px;
    cursor: pointer;
    transition: all 0.15s;
  }

  #name-confirm-btn:hover { background: #ff7700; transform: scale(1.04); }

  .sound-toggle {
    display: flex;
    justify-content: center;
    margin-bottom: 4px;
  }

  #sound-btn {
    font-family: 'Jua', sans-serif;
    font-size: 0.75rem;
    background: var(--panel);
    border: 1px solid var(--border);
    color: #aaa;
    border-radius: 20px;
    padding: 4px 14px;
    cursor: pointer;
    transition: all 0.15s;
  }

  #sound-btn:hover { border-color: var(--blue); color: var(--blue); }
  #sound-btn.on { border-color: var(--green); color: var(--green); background: rgba(0,255,136,0.07); }

  .arena {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: clamp(20px, 6vw, 80px);
    padding: 0 16px 20px;
    position: relative;
    min-height: 260px;
  }

  .character {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    position: relative;
  }

  .char-label {
    font-family: 'Jua', sans-serif;
    font-size: 0.75rem;
    color: #aaa;
    text-align: center;
  }

  .prof-svg, .student-svg {
    width: 80px;
    height: 120px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));
  }

  #particle-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(0.6rem, 1.5vw, 0.85rem);
    color: var(--blue);
    text-shadow: 0 0 8px var(--blue);
    pointer-events: none;
    white-space: nowrap;
  }

  .stats-row {
    display: flex;
    justify-content: center;
    gap: 16px;
    padding: 0 16px 16px;
    flex-wrap: wrap;
  }

  .stat-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    text-align: center;
    min-width: 110px;
  }

  .stat-label { font-size: 0.65rem; color: #666; margin-bottom: 4px; font-family: 'Jua', sans-serif; }
  .stat-value { font-family: 'Black Han Sans', sans-serif; font-size: 1.3rem; }
  .stat-value.prof { color: var(--accent); }
  .stat-value.student { color: var(--green); }
  .stat-value.stolen { color: var(--yellow); }

  .bar-section { padding: 0 20px 16px; max-width: 520px; margin: 0 auto; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bar-name { font-family: 'Jua', sans-serif; font-size: 0.75rem; width: 90px; text-align: right; flex-shrink: 0; }
  .bar-track { flex: 1; height: 14px; background: #1a1a35; border-radius: 7px; overflow: hidden; border: 1px solid var(--border); }
  .bar-fill { height: 100%; border-radius: 7px; transition: width 0.4s ease; }
  .bar-fill.prof-fill { background: linear-gradient(90deg, #ff6b00, #ff4f00); box-shadow: 0 0 8px rgba(255,79,0,0.5); }
  .bar-fill.student-fill { background: linear-gradient(90deg, #00e87a, #00ff88); box-shadow: 0 0 8px rgba(0,255,136,0.4); }

  .btn-section { display: flex; justify-content: center; padding: 0 16px 16px; }

  #steal-btn {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #ff4f00, #ff8800);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px 36px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(255,79,0,0.5);
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }

  #steal-btn:hover { transform: scale(1.04); box-shadow: 0 6px 28px rgba(255,79,0,0.7); }
  #steal-btn:active { transform: scale(0.97); }
  #steal-btn:disabled { background: #333; box-shadow: none; cursor: not-allowed; color: #666; }

  #steal-btn .ripple {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,0.3);
    transform: scale(0); animation: ripple 0.5s linear; pointer-events: none;
  }

  @keyframes ripple { to { transform: scale(4); opacity: 0; } }

  #status-text {
    text-align: center; font-family: 'Jua', sans-serif;
    font-size: 0.9rem; min-height: 22px; color: #777;
    padding: 0 16px 12px; transition: color 0.3s;
  }

  .log-section { max-width: 520px; margin: 0 auto; padding: 0 16px 24px; }
  .log-title { font-family: 'Jua', sans-serif; font-size: 0.75rem; color: #555; margin-bottom: 8px; }

  #log-box {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px; height: 120px;
    overflow-y: auto; font-size: 0.78rem; line-height: 1.8; color: #aaa;
  }

  #log-box::-webkit-scrollbar { width: 4px; }
  #log-box::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

  .log-entry { animation: fadeIn 0.3s ease; }
  .log-entry.important { color: var(--yellow); }
  .log-entry.success { color: var(--green); }
  .log-entry.fail { color: var(--accent); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-5px) rotate(-3deg); }
    40% { transform: translateX(5px) rotate(2deg); }
    60% { transform: translateX(-4px) rotate(-1deg); }
    80% { transform: translateX(3px); }
  }

  .shaking { animation: shake 0.4s ease; }

  @keyframes glow-pulse {
    0%, 100% { filter: drop-shadow(0 0 4px var(--green)); }
    50% { filter: drop-shadow(0 0 16px var(--green)) drop-shadow(0 0 24px rgba(0,255,136,0.4)); }
  }

  .absorbing { animation: glow-pulse 0.6s ease infinite; }

  .victory-banner {
    display: none; text-align: center;
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(1.2rem, 3vw, 1.6rem);
    color: var(--yellow);
    text-shadow: 0 0 20px rgba(255,230,0,0.6);
    padding: 8px 16px; animation: fadeIn 0.5s ease;
  }

  .made-by {
    position: fixed;
    bottom: 14px;
    left: 18px;
    font-family: 'Jua', sans-serif;
    font-size: 0.72rem;
    color: #444;
    z-index: 50;
    letter-spacing: 0.5px;
  }

  .made-by a {
    color: var(--blue);
    text-decoration: none;
    transition: color 0.2s, text-shadow 0.2s;
  }

  .made-by a:hover {
    color: #fff;
    text-shadow: 0 0 8px var(--blue);
  }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--green);
    color: var(--green); font-family: 'Jua', sans-serif; font-size: 0.85rem;
    padding: 8px 20px; border-radius: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s; z-index: 100; white-space: nowrap;
  }

  .toast.show { opacity: 1; }
</style>
</head>

<script>
// ============================================================
// AUDIO ENGINE (Web Audio API — 외부 파일 없음)
// ============================================================
let audioCtx = null;
let soundEnabled = false;

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('sound-btn');
  if (soundEnabled) {
    btn.textContent = '🔊 소리 ON';
    btn.className = 'on';
    playBootSound();
    showToast('🔊 효과음 ON!');
  } else {
    btn.textContent = '🔇 소리 OFF';
    btn.className = '';
    showToast('🔇 효과음 OFF');
  }
}

// ⚡ 지식 강탈 시작음 — 전기 지지직
function playStealSound() {
  if (!soundEnabled) return;
  const ctx = getCtx();
  const now = ctx.currentTime;

  // 전기 스파크 (노이즈 버스트 6개)
  for (let i = 0; i < 6; i++) {
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.08, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let j = 0; j < d.length; j++) d[j] = (Math.random() * 2 - 1) * (1 - j / d.length);
    const src = ctx.createBufferSource();
    const filt = ctx.createBiquadFilter();
    filt.type = 'bandpass';
    filt.frequency.value = 2000 + i * 800;
    filt.Q.value = 0.5;
    const g = ctx.createGain();
    g.gain.value = 0.15;
    src.buffer = buf;
    src.connect(filt); filt.connect(g); g.connect(ctx.destination);
    src.start(now + i * 0.07);
  }

  // 저음 웅웅
  const osc = ctx.createOscillator();
  const og = ctx.createGain();
  osc.connect(og); og.connect(ctx.destination);
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(80, now);
  osc.frequency.exponentialRampToValueAtTime(40, now + 0.5);
  og.gain.setValueAtTime(0.15, now);
  og.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
  osc.start(now); osc.stop(now + 0.5);
}

// 🧠 흡수 완료음 — 밝은 코드 상승
function playAbsorbSound() {
  if (!soundEnabled) return;
  const ctx = getCtx();
  const now = ctx.currentTime;
  const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
  notes.forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0, now + i * 0.09);
    g.gain.linearRampToValueAtTime(0.14, now + i * 0.09 + 0.04);
    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.45);
    osc.start(now + i * 0.09);
    osc.stop(now + i * 0.09 + 0.5);
  });

  // 반짝 하이톤
  const hi = ctx.createOscillator();
  const hg = ctx.createGain();
  hi.connect(hg); hg.connect(ctx.destination);
  hi.type = 'triangle';
  hi.frequency.value = 2093;
  hg.gain.setValueAtTime(0.07, now + 0.35);
  hg.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
  hi.start(now + 0.35); hi.stop(now + 0.75);
}

// ❌ 실패음 — 내려가는 삐-삐-빕
function playFailSound() {
  if (!soundEnabled) return;
  const ctx = getCtx();
  const now = ctx.currentTime;
  [300, 220, 150].forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.type = 'square';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.12, now + i * 0.13);
    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.13 + 0.12);
    osc.start(now + i * 0.13);
    osc.stop(now + i * 0.13 + 0.15);
  });
}

// 🎓 승리 팡파레
function playVictorySound() {
  if (!soundEnabled) return;
  const ctx = getCtx();
  const now = ctx.currentTime;

  // 멜로디
  [[523,0],[659,0.13],[784,0.26],[1047,0.42],[880,0.65],[1047,0.8],[1319,1.0]].forEach(([f,t]) => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.type = 'triangle';
    osc.frequency.value = f;
    g.gain.setValueAtTime(0.18, now + t);
    g.gain.exponentialRampToValueAtTime(0.001, now + t + 0.28);
    osc.start(now + t); osc.stop(now + t + 0.35);
  });

  // 심벌즈 노이즈
  [0.42, 1.0].forEach(t => {
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.4, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1)*(1-i/d.length);
    const src = ctx.createBufferSource();
    const filt = ctx.createBiquadFilter();
    filt.type = 'highpass'; filt.frequency.value = 6000;
    const g = ctx.createGain(); g.gain.value = 0.06;
    src.buffer = buf;
    src.connect(filt); filt.connect(g); g.connect(ctx.destination);
    src.start(now + t);
  });
}

// 🔊 부팅음
function playBootSound() {
  if (!soundEnabled) return;
  const ctx = getCtx();
  const now = ctx.currentTime;
  [440, 554, 659].forEach((f, i) => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.type = 'sine'; osc.frequency.value = f;
    g.gain.setValueAtTime(0.09, now + i * 0.1);
    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.2);
    osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.25);
  });
}

function playNameSound() {

// GAME LOGIC
// ============================================================
const formulas = [
  "∫∫∫ dV = 죽고싶다",
  "lim(x→졸음) IQ = 0",
  "∂²u/∂t² = c²∇²u + 왜때문에",
  "F = ma (M = 모르겠다)",
  "e^(iπ) + 1 = 내학점",
  "∇·E = ρ/ε₀ (몰라)",
  "λ = h/p = 내인생",
  "σ = √(Σ(xi-μ)²/n)",
  "det(A) ≠ 0 → 역행렬 존재",
  "푸리에 변환: 살려줘",
  "PV = nRT = 배고프다",
  "y'' + py' + qy = 포기",
  "rank(A) + nullity(A) = n",
  "sin²θ + cos²θ = 1 (이것만 앎)",
  "라플라시안 ∆f = div(grad f)",
  "고유값 λ: det(A-λI) = 0",
  "테일러: f(x) ≈ f(a) + ...",
  "가우스 소거법 → 수면제",
  "ε-δ 논법 = 수면제 2배",
  "벡터 내적 a·b = |a||b|cosθ",
];

let profKnowledge = 100;
let studentIQ = 40;
let stolenCount = 0;
let isAnimating = false;
let profName = '홍길동';

function confirmName() {
  const input = document.getElementById('prof-name-input').value.trim();
  if (!input) return;
  profName = input;
  document.getElementById('prof-label').innerHTML =
    `${profName} 교수<br><span style="color:#ff4f00;font-size:0.7rem">지식: <span id="prof-knowledge-label">${Math.max(0,profKnowledge)}</span>%</span>`;
  document.getElementById('prof-stat-label').textContent = `${profName} 교수 지식량`;
  playNameSound();
  showToast(`👨‍🏫 "${profName} 교수님" 타겟 설정!`);
  addLog(`타겟 변경 → [${profName} 교수] 추적 시작`, 'important');
}

document.getElementById('prof-name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') confirmName();
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function getProfHeadPos() {
  const prof = document.getElementById('prof-char').getBoundingClientRect();
  const arena = document.getElementById('arena').getBoundingClientRect();
  return { x: prof.left - arena.left + prof.width / 2, y: prof.top - arena.top + 20 };
}

function getStudentHeadPos() {
  const stu = document.getElementById('student-char').getBoundingClientRect();
  const arena = document.getElementById('arena').getBoundingClientRect();
  return { x: stu.left - arena.left + stu.width / 2, y: stu.top - arena.top + 20 };
}

function spawnParticle(text, fromX, fromY, toX, toY, delay) {
  const container = document.getElementById('particle-container');
  const el = document.createElement('div');
  el.className = 'particle';
  el.textContent = text;
  el.style.left = fromX + 'px';
  el.style.top = fromY + 'px';
  el.style.opacity = '0';
  container.appendChild(el);

  const duration = 1800 + Math.random() * 800;
  const startTime = performance.now() + delay;

  function animate(now) {
    if (now < startTime) { requestAnimationFrame(animate); return; }
    const elapsed = now - startTime;
    const t = Math.min(elapsed / duration, 1);
    const ease = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
    const x = fromX + (toX - fromX) * ease + Math.sin(t * Math.PI * 2) * 15;
    const y = fromY + (toY - fromY) * ease - Math.sin(t * Math.PI) * 30;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.opacity = t < 0.1 ? t * 10 : t > 0.85 ? (1-t) * 6.67 : 1;
    el.style.transform = `scale(${0.7 + t * 0.5}) rotate(${Math.sin(t*10)*8}deg)`;
    if (t < 1) requestAnimationFrame(animate);
    else el.remove();
  }
  requestAnimationFrame(animate);
}

function addLog(msg, type = '') {
  const box = document.getElementById('log-box');
  const entry = document.createElement('div');
  entry.className = 'log-entry ' + type;
  const time = new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  entry.textContent = `[${time}] ${msg}`;
  box.insertBefore(entry, box.firstChild);
  while (box.children.length > 30) box.removeChild(box.lastChild);
}

function updateUI() {
  document.getElementById('prof-bar').style.width = Math.max(0, profKnowledge) + '%';
  document.getElementById('student-bar').style.width = Math.min(100, (studentIQ - 40) / 160 * 100 + 4) + '%';
  document.getElementById('prof-stat').textContent = Math.max(0, profKnowledge) + '%';
  document.getElementById('student-stat').textContent = studentIQ;
  document.getElementById('stolen-stat').textContent = stolenCount + '개';
  const kl = document.getElementById('prof-knowledge-label');
  if (kl) kl.textContent = Math.max(0, profKnowledge);
  document.getElementById('student-iq-label').textContent = studentIQ;
}

const statusPool = [
  () => `${profName} 교수님이 뭔가 이상함을 눈치채고 있습니다...`,
  () => `지식이 빠져나가는 중... ${profName} 교수님 멍해짐`,
  () => `${profName} 교수님: '요즘 왜 이렇게 정신이 없지...'`,
  () => `강탈 성공! ${profName} 교수님 잠시 멍청해짐`,
  () => `${profName} 교수님이 갑자기 칠판 앞에서 멈춤`,
  () => `흡수 중... 뇌 용량 부족 경고!`,
  () => `${profName} 교수님 눈빛이 흐릿해지는 중...`,
  () => `지식 패킷 손실 없음. 완벽한 강탈.`,
  () => `${profName} 교수님: '내가 왜 여기 있지?'`,
  () => `뇌파 동기화 완료. 흡수율 87%.`,
];

const failPool = [
  () => `❌ ${profName} 교수님이 출석 불렀습니다. 강탈 실패.`,
  () => `❌ 와이파이 끊김. 지식 패킷 유실.`,
  () => `❌ ${profName} 교수님이 안경을 닦으며 눈치챘습니다.`,
  () => `❌ 잡혔습니다... 아닌척 했습니다.`,
  () => `❌ ${profName} 교수님이 갑자기 시험 공지. 패닉.`,
];

function stealKnowledge() {
  if (isAnimating || profKnowledge <= 0) return;

  if (Math.random() < 0.15) {
    const msg = failPool[Math.floor(Math.random() * failPool.length)]();
    document.getElementById('status-text').textContent = msg;
    document.getElementById('status-text').style.color = 'var(--accent)';
    addLog(msg, 'fail');
    playFailSound();
    const profSvg = document.getElementById('prof-svg');
    profSvg.classList.add('shaking');
    setTimeout(() => profSvg.classList.remove('shaking'), 500);
    return;
  }

  isAnimating = true;
  const btn = document.getElementById('steal-btn');
  btn.disabled = true;

  playStealSound();

  const profHead = getProfHeadPos();
  const stuHead = getStudentHeadPos();

  document.getElementById('brain-glow').setAttribute('opacity', '1');
  document.getElementById('student-glow').setAttribute('opacity', '1');

  const count = 4 + Math.floor(Math.random() * 4);
  const shuffled = [...formulas].sort(() => Math.random() - 0.5).slice(0, count);
  shuffled.forEach((f, i) => spawnParticle(f, profHead.x, profHead.y, stuHead.x, stuHead.y, i * 220));

  const profSvg = document.getElementById('prof-svg');
  setTimeout(() => { profSvg.classList.add('shaking'); }, 100);
  setTimeout(() => { profSvg.classList.remove('shaking'); }, 600);

  const stuSvg = document.getElementById('student-svg');
  setTimeout(() => {
    stuSvg.classList.add('absorbing');
    playAbsorbSound();
  }, 1200);

  const statusMsg = statusPool[Math.floor(Math.random() * statusPool.length)]();
  document.getElementById('status-text').textContent = statusMsg;
  document.getElementById('status-text').style.color = 'var(--blue)';

  const stolen = 3 + Math.floor(Math.random() * 8);
  const iqGain = 1 + Math.floor(Math.random() * 4);

  setTimeout(() => {
    profKnowledge = Math.max(0, profKnowledge - stolen);
    studentIQ = Math.min(200, studentIQ + iqGain);
    stolenCount++;
    updateUI();

    addLog(`흡수 완료: "${shuffled[shuffled.length-1]}" (+IQ ${iqGain})`, 'success');

    stuSvg.classList.remove('absorbing');
    document.getElementById('brain-glow').setAttribute('opacity', '0');
    document.getElementById('student-glow').setAttribute('opacity', '0');

    if (profKnowledge <= 0) {
      document.getElementById('status-text').textContent =
        `${profName} 교수님 지식 완전 소진... 이제 유튜브나 보심`;
      document.getElementById('status-text').style.color = 'var(--yellow)';
      document.getElementById('victory-banner').style.display = 'block';
      btn.textContent = '🎓 강탈 완료 🎓';
      addLog(`🏆 ${profName} 교수님 지식 완전 강탈! 학점 4.5 확정`, 'important');
      playVictorySound();
    } else {
      btn.disabled = false;
      document.getElementById('status-text').style.color = '#777';
      document.getElementById('status-text').textContent = `지식 ${stolen}% 강탈 성공 · IQ +${iqGain}`;
    }

    isAnimating = false;
  }, 2200);

  // Ripple
  const rect = btn.getBoundingClientRect();
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  const size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = '50%'; ripple.style.top = '50%';
  ripple.style.marginLeft = ripple.style.marginTop = -size/2 + 'px';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
}

// Init
addLog('시스템 부팅 완료. 교수님 탐지 중...', 'important');
addLog('경고: 이 프로그램은 비윤리적입니다. (그래서 씁니다)', '');
addLog('💡 소리 버튼을 눌러 효과음을 켜세요', '');
updateUI();
